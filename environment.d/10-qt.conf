# Оформление Qt-приложений.
#
# Проверено на Qt 6 (PySide6, замер фона окна): без этой переменной Qt отдаёт
# ColorScheme.Unknown и светлую палитру (#efefef). С QT_QPA_PLATFORMTHEME=gtk3
# Qt берёт цвета из GTK, то есть из ~/.config/gtk-*/colors.css — а его пишет
# scripts/apps-theme.py из палитры обоев. Так GTK, KDE и Qt выглядят одинаково и
# следуют за светлой/тёмной темой обоев.
QT_QPA_PLATFORMTHEME=gtk3
