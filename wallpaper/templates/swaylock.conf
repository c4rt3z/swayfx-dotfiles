# swaylock-effects — цвета подставляет theme-render.py (см. ~/.config/wallpaper/).
# Вручную не править: файл перезаписывается при смене темы или обоев.
#
# Фон — снимок экрана (актуальные обои и окна), размытый и с виньеткой.
# Кольцо и текст — в цветах палитры, подложка полупрозрачная, как у панелей.

# --- поведение ---
ignore-empty-password
show-failed-attempts
indicator-caps-lock
submit-on-touch
show-keyboard-layout

# --- фон ---
screenshots
effect-blur=16x4
effect-vignette=0.35:0.75
scaling=fill
fade-in=0.2

# --- кольцо и подложка ---
color={{bg}}
inside-color={{bg}}e6
inside-clear-color={{bg}}e6
inside-ver-color={{bg}}e6
inside-wrong-color={{bg}}e6
inside-caps-lock-color={{bg}}e6

ring-color={{accent}}99
ring-clear-color={{accent}}66
ring-ver-color={{accent}}
ring-wrong-color={{red}}
ring-caps-lock-color={{red}}

line-color={{accent}}66
line-clear-color={{accent}}40
line-ver-color={{accent}}
line-wrong-color={{red}}
line-caps-lock-color={{red}}

text-color={{fg}}
text-clear-color={{fg_dim}}
text-ver-color={{accent}}
text-wrong-color={{red}}
text-caps-lock-color={{red}}

key-hl-color={{accent}}
bs-hl-color={{red}}
caps-lock-key-hl-color={{red}}
caps-lock-bs-hl-color={{red}}

# --- подпись раскладки клавиатуры ---
layout-bg-color={{bg}}e6
layout-border-color={{outline}}
layout-text-color={{accent}}

# --- шрифт и размеры ---
font=JetBrains Mono
font-size=18
indicator-radius=160
indicator-thickness=10
indicator-idle-visible

# --- время и дата над кольцом ---
# день недели не влезает в кольцо вместе с числом — оставляем «17 октября»
clock
timestr=%H:%M
datestr=%d %B
